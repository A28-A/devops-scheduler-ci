name: CI Scheduler Workflow

on:
  push:
    branches:
      - main

  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

jobs:
  run-task:
    runs-on: ubuntu-latest\n

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Run script
        run: echo "Hello from CI" && date
